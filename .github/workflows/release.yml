name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Checkout pinned vcpkg
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: microsoft/vcpkg
          ref: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
          path: vcpkg

      - name: Restore dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: release-vcpkg-windows-2022-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Build and test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          cmake -S . -B out\build\windows-release `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCYAN_WARNINGS_AS_ERRORS=ON
          cmake --build out\build\windows-release --config Release --parallel 4
          ctest --test-dir out\build\windows-release -C Release --output-on-failure

      - name: Assemble release
        shell: pwsh
        run: |
          cmake --install out\build\windows-release --prefix out\package --config Release
          Compress-Archive -Path out\package\* -DestinationPath cyan-cpp-windows-x64.zip -CompressionLevel Optimal -Force
          (Get-FileHash cyan-cpp-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  cyan-cpp-windows-x64.zip' | Set-Content cyan-cpp-windows-x64.sha256 -Encoding ascii
          .\scripts\generate-sbom.ps1 -OutputPath cyan-cpp-windows-x64.spdx.json

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' cyan-cpp-windows-x64.zip cyan-cpp-windows-x64.sha256 cyan-cpp-windows-x64.spdx.json --verify-tag --generate-notes
