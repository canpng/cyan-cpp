name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag (vMAJOR.MINOR.PATCH)
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      VCPKG_ROOT: D:\v
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify stable release version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Stable release tags must use vMAJOR.MINOR.PATCH (received $tag)"
          }
          $manifestVersion = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'version-string'
          if ($tag -ne "v$manifestVersion") {
            throw "Release tag $tag does not match project version $manifestVersion"
          }

      - name: Checkout pinned vcpkg to a real short path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgCommit = 'cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3'
          if (Test-Path $env:VCPKG_ROOT) {
            throw "$env:VCPKG_ROOT is already in use"
          }
          git init $env:VCPKG_ROOT
          if ($LASTEXITCODE -ne 0) { throw "failed to initialize vcpkg repository" }
          git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg.git
          if ($LASTEXITCODE -ne 0) { throw "failed to configure vcpkg remote" }
          git -C $env:VCPKG_ROOT fetch --depth 1 origin $vcpkgCommit
          if ($LASTEXITCODE -ne 0) { throw "failed to fetch pinned vcpkg commit" }
          git -C $env:VCPKG_ROOT checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "failed to checkout pinned vcpkg" }
          $actualCommit = git -C $env:VCPKG_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualCommit -ne $vcpkgCommit) {
            throw "vcpkg checkout mismatch: expected $vcpkgCommit, got $actualCommit"
          }

      - name: Restore pinned vcpkg tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.VCPKG_ROOT }}\vcpkg.exe
          key: vcpkg-tool-windows-cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      - name: Restore dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-2022-release-only-v4-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/x64-windows-release.cmake') }}
          restore-keys: |
            vcpkg-windows-2022-release-only-v4-

      - name: Verify bundled Team ID-capable Procursus ldid
        shell: pwsh
        run: .\scripts\fetch-ldid.ps1 -OutputPath out\tools\ldid.exe

      - name: Build and test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          .\scripts\bootstrap-vcpkg.ps1 -VcpkgRoot $env:VCPKG_ROOT
          cmake -S . -B out\build\windows-release `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DVCPKG_HOST_TRIPLET=x64-windows-release `
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}\cmake\triplets" `
            -DVCPKG_MANIFEST_FEATURES=gui `
            -DCYAN_BUILD_GUI=ON `
            -DCYAN_LDID_EXECUTABLE="${{ github.workspace }}\out\tools\ldid.exe" `
            -DCYAN_WARNINGS_AS_ERRORS=ON
          cmake --build out\build\windows-release --config Release --parallel 4
          ctest --test-dir out\build\windows-release -C Release --output-on-failure

      - name: Assemble release
        shell: pwsh
        run: |
          cmake --install out\build\windows-release --prefix "${{ github.workspace }}\out\package" --config Release
          .\scripts\test-windows-package.ps1 -PackageRoot out\package
          $baseName = "cyan-cpp-${env:RELEASE_TAG}-windows-x64"
          Compress-Archive -Path out\package\* -DestinationPath "$baseName.zip" -CompressionLevel Optimal -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $baseName = "cyan-cpp-$tag-windows-x64"
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            gh release create $tag "$baseName.zip" --target '${{ github.sha }}' --generate-notes --title "cyan-cpp $tag" --latest
          } else {
            gh release create $tag "$baseName.zip" --verify-tag --generate-notes --title "cyan-cpp $tag" --latest
          }
