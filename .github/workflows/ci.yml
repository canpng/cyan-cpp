name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows 2022 / Release
    runs-on: windows-2022

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Checkout pinned vcpkg
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: microsoft/vcpkg
          ref: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
          path: vcpkg

      - name: Restore pinned vcpkg tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.VCPKG_ROOT }}\vcpkg.exe
          key: vcpkg-tool-windows-cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-2022-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-windows-2022-release-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\scripts\bootstrap-vcpkg.ps1 -VcpkgRoot $env:VCPKG_ROOT

      - name: Verify bundled Team ID-capable Procursus ldid
        shell: pwsh
        run: .\scripts\fetch-ldid.ps1 -OutputPath out\tools\ldid.exe

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake -S . -B out\build\windows-release `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_MANIFEST_FEATURES=gui `
            -DCYAN_BUILD_GUI=ON `
            -DCYAN_LDID_EXECUTABLE="${{ github.workspace }}\out\tools\ldid.exe" `
            -DCYAN_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: pwsh
        run: cmake --build out\build\windows-release --config Release --parallel 4

      - name: Test
        shell: pwsh
        run: ctest --test-dir out\build\windows-release -C Release --output-on-failure

      - name: CLI smoke test
        shell: pwsh
        run: |
          $build = "out\build\windows-release\Release"
          & "$build\cyan.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "cyan --help failed" }
          & "$build\cyan.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "cyan --version failed" }
          & "$build\cgen.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "cgen --help failed" }
          & "$build\ipapatch.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "ipapatch --help failed" }
          & "$build\ipapatch.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "ipapatch --version failed" }
          if (-not (Test-Path "$build\zxPluginsInject.dylib" -PathType Leaf)) {
            throw "pinned ipapatch payload was not copied"
          }
          $payloadHash = (Get-FileHash "$build\zxPluginsInject.dylib" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($payloadHash -ne "cd903ea15657cbd356398adcb60c8872c41c29b69acc1a5dfb78a49d6e75dea5") {
            throw "pinned ipapatch payload hash mismatch"
          }
          if (-not (Test-Path "$build\cyan-gui.exe" -PathType Leaf)) {
            throw "cyan-gui.exe was not built"
          }

      - name: Package
        shell: pwsh
        run: |
          cmake --install out\build\windows-release --prefix out\package --config Release
          $requiredFiles = @("cyan-gui.exe", "cyan.exe", "cgen.exe", "ipapatch.exe", "ldid.exe")
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path "out\package\$requiredFile" -PathType Leaf)) {
              throw "$requiredFile is missing from the package"
            }
          }
          if (-not (Get-ChildItem out\package -Recurse -File -Filter Qt6Core.dll)) {
            throw "Qt runtime was not deployed"
          }
          if (-not (Get-ChildItem out\package -Recurse -File -Filter qwindows.dll)) {
            throw "Qt Windows platform plugin was not deployed"
          }
          Compress-Archive -Path out\package\* -DestinationPath cyan-cpp-windows-x64.zip -CompressionLevel Optimal -Force
          (Get-FileHash cyan-cpp-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  cyan-cpp-windows-x64.zip' | Set-Content cyan-cpp-windows-x64.sha256 -Encoding ascii
          .\scripts\generate-sbom.ps1 -OutputPath cyan-cpp-windows-x64.spdx.json

      - name: Upload Release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cyan-cpp-windows-2022-x64
          path: |
            cyan-cpp-windows-x64.zip
            cyan-cpp-windows-x64.sha256
            cyan-cpp-windows-x64.spdx.json
          if-no-files-found: error
